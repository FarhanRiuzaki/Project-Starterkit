# The stack as it runs in production: PostgreSQL 18, one-shot migrations, the API (reachable only inside the compose
# network) and the web on http://localhost:3001 (never :3000, the dev server's port).
#   cp .env.compose.example .env.compose   # then replace every change-me and fill the secrets
#   docker compose up -d --build
#   docker compose run --rm migrate bun run db:seed   # first Superadmin from SEED_SUPERADMIN_* (once)
# Every service reads .env.compose; `environment` blanks the keys a service must not hold (empty = unset for both apps).
# ponytail: one env file for the stack; split it per service if they ever run under different trust.
name: starterkit

services:
  postgres:
    image: postgres:18
    env_file: .env.compose
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: starterkit
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once, when the volume is new: creates the app role of DATABASE_URL (DML only).
      - ./scripts/compose-app-role.sh:/docker-entrypoint-initdb.d/app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d starterkit"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Applies pending migrations as the schema owner (MIGRATION_DATABASE_URL), then exits.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: starterkit-api:local
    command: ["bun", "run", "db:migrate"]
    env_file: .env.compose
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: starterkit-api:local
    env_file: .env.compose
    environment:
      APP_URL: http://localhost:3001
      MIGRATION_DATABASE_URL: ""
      POSTGRES_PASSWORD: ""
      SESSION_SECRET: ""
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: starterkit-web:local
    env_file: .env.compose
    environment:
      API_BASE_URL: http://api:4000
      DATABASE_URL: ""
      MIGRATION_DATABASE_URL: ""
      POSTGRES_PASSWORD: ""
      APP_DB_PASSWORD: ""
      DATA_ENCRYPTION_KEY: ""
    ports:
      - "3001:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
